<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberRakshak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-200">

    <nav class="bg-black/90 backdrop-blur-md border-b border-emerald-900 fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-3xl">🛡️</div>
                <span class="title-font text-3xl font-bold tracking-tighter neon-green">CYBERRAKSHAK</span>
            </div>
            <div class="flex items-center gap-6">
                <a href="login.html" class="hover:text-emerald-400">Login</a>
                <a href="signup.html" class="bg-emerald-500 hover:bg-emerald-400 text-black font-semibold px-6 py-2.5 rounded-2xl">Sign Up</a>
                <a href="dashboard.html" class="hover:text-emerald-400 font-medium">Launch App</a>
            </div>
        </div>
    </nav>

    <section class="hero-bg min-h-screen flex items-center pt-20">
        <div class="matrix"></div>
        <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center">
            <div class="space-y-8">
                <h1 class="text-6xl md:text-7xl font-bold title-font leading-none tracking-tighter">
                    Be the <span class="text-emerald-400 neon-green">Cyber Shield</span><br>India Deserves
                </h1>
                <p class="text-xl text-zinc-300 max-w-lg">Learn cybersecurity by playing. Detect scams with AI, complete simulations & climb the leaderboard.</p>
                <a href="dashboard.html" class="inline-block px-10 py-5 bg-emerald-500 hover:bg-white hover:text-black text-black font-bold text-lg rounded-3xl flex items-center gap-3 transition-all">
                    <i class="fas fa-rocket"></i> LAUNCH APP
                </a>
            </div>
        </div>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
