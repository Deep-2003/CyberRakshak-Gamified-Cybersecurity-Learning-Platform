<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Authentication - CyberRakshak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-200 antialiased h-screen flex items-center justify-center bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-zinc-900 via-zinc-950 to-zinc-950">

    <!-- Primary Authentication Box Container -->
    <div class="w-full max-w-md mx-4">
        
        <!-- Platform Branding Top Anchor -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-emerald-500 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-xl shadow-emerald-500/10">🛡️</div>
            <h1 class="title-font text-3xl font-bold tracking-wider neon-green mb-1">CYBERRAKSHAK</h1>
            <p class="text-xs font-mono text-zinc-500 tracking-widest uppercase">Autonomous Security Portal Protocol</p>
        </div>

        <!-- Glassmorphism Form Card Layer -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            
            <!-- Context Switch Matrix Layer -->
            <form id="auth-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-mono font-bold tracking-wider text-emerald-400 uppercase mb-2">Agent Username</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-600 text-sm font-mono">⚡</span>
                        <input type="text" id="username" required autocomplete="username" placeholder="Enter tactical callsign..." class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl pl-10 pr-4 py-3.5 text-zinc-200 placeholder-zinc-700 focus:outline-none focus:border-emerald-500 font-mono text-sm transition-all duration-200">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-mono font-bold tracking-wider text-emerald-400 uppercase mb-2">Security Passkey Token</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-600 text-sm">🔒</span>
                        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl pl-10 pr-4 py-3.5 text-zinc-200 placeholder-zinc-700 focus:outline-none focus:border-emerald-500 font-mono text-sm tracking-widest transition-all duration-200">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-black font-bold tracking-wide rounded-2xl shadow-lg shadow-emerald-500/10 hover:shadow-emerald-500/20 transition-all duration-300">
                        Authorize Terminal Access
                    </button>
                </div>
            </form>

            <!-- Interactive Terminal Validation Handshake Mask Node (Hidden natively) -->
            <div id="auth-handshake-loader" class="hidden absolute inset-0 bg-zinc-950/95 flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent mb-4"></div>
                <h4 class="font-mono text-sm font-bold text-emerald-400 mb-2 tracking-wider uppercase">Executing Security Handshake</h4>
                <div id="handshake-logs" class="w-full font-mono text-[10px] text-zinc-500 max-w-xs space-y-1 text-left bg-black/50 p-3 rounded-lg border border-zinc-900 h-20 overflow-y-hidden leading-relaxed">
                    <!-- Logs stream programmatically during processing runtime -->
                </div>
            </div>

        </div>

        <!-- Informational Footer Subtext -->
        <p class="text-center text-[10px] font-mono text-zinc-600 mt-6 tracking-wider uppercase">
            Authorized Personnel Node Monitoring Pipeline Active.
        </p>

    </div>

    <!-- Active Structural Application Script Binding Link Pass -->
    <script src="js/app.js"></script>
    <script>
        // Form Processing Subsystem Implementation Handler Engine
        function handleLogin(event) {
            event.preventDefault(); // Halt standard native redirection protocols

            const userField = document.getElementById('username').value.trim();
            const passField = document.getElementById('password').value;
            const loaderMask = document.getElementById('auth-handshake-loader');
            const logBox = document.getElementById('handshake-logs');

            if(!userField || !passField) return;

            // Trigger loading interface frame mask
            loaderMask.classList.remove('hidden');

            // Log sequence simulation mapping
            const consoleLogs = [
                "> Initializing identity assertion handshake request...",
                "> Validating cryptographic vector token signatures...",
                "> Mapping metrics profile tracking storage matrices...",
                "> Authorization assertion authorized. Syncing system keys..."
            ];

            // Render log outputs sequentially across timed ticks
            consoleLogs.forEach((logLine, index) => {
                setTimeout(() => {
                    const lineNode = document.createElement('p');
                    lineNode.textContent = logLine;
                    if (index === consoleLogs.length - 1) lineNode.className = "text-emerald-500 font-bold";
                    logBox.appendChild(lineNode);
                }, index * 450);
            });

            // Conclude assertion process and save mock user telemetry payload array state values
            setTimeout(() => {
                if (typeof initializeMockSession === 'function') {
                    initializeMockSession({
                        username: userField,
                        xp: 150, // Grant baseline operational status initial XP credits
                        completedSimulations: 0,
                        scanHistoryCount: 0
                    });
                } else {
                    // Fallback storage routing safety parameters if app.js references drift
                    localStorage.setItem('cyberrakshak_user_session', JSON.stringify({ username: userField, xp: 150 }));
                    window.location.href = 'dashboard.html';
                }
            }, 2000);
        }
    </script>
</body>
</html>
