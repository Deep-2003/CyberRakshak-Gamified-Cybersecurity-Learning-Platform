<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CyberRakshak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-auto p-8">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-emerald-500 rounded-3xl mx-auto flex items-center justify-center text-4xl mb-4">🛡️</div>
            <h1 class="text-4xl title-font font-bold neon-green">CYBERRAKSHAK</h1>
        </div>

        <div class="bg-zinc-900 rounded-3xl p-10">
            <h2 class="text-3xl font-bold mb-8 text-center">Join the Shield</h2>
            
            <input id="signupName" type="text" placeholder="Full Name" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-4 mb-4 focus:border-emerald-500 outline-none">
            <input id="signupEmail" type="email" placeholder="Email" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-4 mb-8 focus:border-emerald-500 outline-none">
            
            <button onclick="attemptSignup()" class="w-full py-4 bg-emerald-500 text-black font-bold text-lg rounded-2xl hover:scale-105 transition">CREATE ACCOUNT</button>
            
            <p class="text-center mt-6 text-zinc-400">
                Already have an account? <a href="login.html" class="text-emerald-400 hover:underline">Login</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
