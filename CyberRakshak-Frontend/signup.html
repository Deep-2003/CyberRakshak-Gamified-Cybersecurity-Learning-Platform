<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Registration - CyberRakshak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-zinc-950 text-zinc-200 antialiased animated-bg min-h-screen flex flex-col items-center justify-center p-6">

    <div class="flex flex-col items-center mb-8 text-center select-none">
        
        <a href="index.html" class="group flex flex-col items-center">
            <div class="relative w-20 h-20 bg-black border border-emerald-500/20 rounded-2xl flex items-center justify-center shadow-2xl shadow-emerald-950/50 mb-4 transition-all duration-500 group-hover:border-emerald-400/50">
                <div class="absolute inset-0 rounded-2xl bg-gradient-to-tr from-emerald-500/10 to-cyan-500/0 opacity-100"></div>
                <svg class="w-14 h-14 filter drop-shadow-[0_0_8px_rgba(16,185,129,0.5)] group-hover:rotate-[360deg] transition-all duration-700 ease-out" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="44" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8 6 12 4" stroke-opacity="0.3" />
                    <circle cx="50" cy="50" r="44" stroke="#34d399" stroke-width="2" stroke-dasharray="40 120" stroke-linecap="round" />
                    <path d="M50 12L80 25V52C80 72.5 67 87.5 50 91C33 87.5 20 72.5 20 52V25L50 12Z" stroke="url(#signup_shield_gradient)" stroke-width="4.5" stroke-linejoin="round" fill="#030305" />
                    <path d="M50 20V83M29 38H71M24 54H76M30 70H70" stroke="#047857" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3 3" />
                    <path d="M36 50L46 59L64 39" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="signup_shield_gradient" x1="50" y1="12" x2="50" y2="91" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#34d399" />
                            <stop offset="50%" stop-color="#10b981" />
                            <stop offset="100%" stop-color="#06b6d4" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="title-font text-4xl font-black tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-white via-zinc-200 to-zinc-400 leading-none group-hover:from-emerald-400 group-hover:to-teal-300 transition-all duration-300">CYBERRAKSHAK</h1>
        </a>
        <p class="text-[10px] font-mono tracking-[0.3em] text-zinc-500 font-bold uppercase mt-2">INITIALIZE NEW OPERATOR NODE PROFILE</p>
    </div>

    <div class="glass-panel w-full max-w-md rounded-3xl p-8 border border-zinc-900/80 shadow-2xl relative overflow-hidden bg-zinc-950/40">
        
        <form id="terminal-signup-form" class="space-y-5">
            
            <div>
                <label class="block text-[11px] font-mono font-bold tracking-widest text-emerald-400 uppercase mb-2">AGENT CALLSIGN (USERNAME)</label>
                <div class="relative flex items-center">
                    <span class="absolute left-5 text-sm select-none pointer-events-none opacity-80">🥷</span>
                    <input type="text" id="signup-username" required autocomplete="username" placeholder="e.g., Deepanshu_Singh" class="w-full bg-[#eef4ff] text-zinc-900 font-mono font-medium rounded-2xl pl-12 pr-5 py-3.5 text-base focus:outline-none transition-all duration-200 border-none">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-mono font-bold tracking-widest text-emerald-400 uppercase mb-2">SECURE EMAIL ADDRESS</label>
                <div class="relative flex items-center">
                    <span class="absolute left-5 text-sm select-none pointer-events-none opacity-80">📩</span>
                    <input type="email" id="signup-email" required autocomplete="email" placeholder="operator@domain.com" class="w-full bg-[#eef4ff] text-zinc-900 font-mono font-medium rounded-2xl pl-12 pr-5 py-3.5 text-base focus:outline-none transition-all duration-200 border-none">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-mono font-bold tracking-widest text-emerald-400 uppercase mb-2">CREATE SECURITY PASSKEY TOKEN</label>
                <div class="relative flex items-center">
                    <span class="absolute left-5 text-sm select-none pointer-events-none opacity-80">🔒</span>
                    <input type="password" id="signup-password" required autocomplete="new-password" placeholder="••••••••••••" class="w-full bg-[#eef4ff] text-zinc-900 font-mono font-medium rounded-2xl pl-12 pr-5 py-3.5 text-base focus:outline-none transition-all duration-200 border-none">
                </div>
            </div>

            <button type="submit" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-black font-extrabold text-lg rounded-2xl tracking-wide transition-all duration-200 shadow-xl shadow-emerald-950/40 mt-4">
                Register Operator Node
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-zinc-900/60 text-center">
            <p class="text-xs text-zinc-500 font-mono">
                Already registered in the grid? <a href="login.html" class="text-emerald-400 hover:underline hover:text-emerald-300 ml-1">Authorize access</a>
            </p>
        </div>
    </div>

    <div class="mt-8 text-[10px] font-mono tracking-widest text-zinc-600 select-none uppercase">
        SECURE ACCOUNT PROVISIONING STAGE ACTIVE // DATA IS ENCRYPTED.
    </div>

    <script src="js/app.js"></script>
    <script>
        // Intercept native browser transmission loops to manage registrations smoothly via global app logic
        document.getElementById("terminal-signup-form").addEventListener("submit", async (event) => {
            event.preventDefault(); // HALT page reload behavior

            const userField = document.getElementById("signup-username").value.trim();
            const emailField = document.getElementById("signup-email").value.trim();
            const passField = document.getElementById("signup-password").value;
            const actionButton = event.target.querySelector("button[type='submit']");

            if (!userField || !emailField || !passField) return;

            // Visual Processing Lock Feedback State
            actionButton.disabled = true;
            actionButton.textContent = "Provisioning Credentials...";
            actionButton.classList.add("opacity-50", "cursor-wait");

            try {
                // Route parameters into the verified submitSignup function mapped inside js/app.js
                if (typeof window.submitSignup === "function") {
                    await window.submitSignup(userField, emailField, passField);
                } else {
                    console.error("Critical Instability: window.submitSignup module handler missing from window runtime context.");
                    alert("System Interface Error: Core app orchestration engine script was not initialized properly.");
                }
            } catch (err) {
                console.error("Intercepted Registration Handshake Error Loop:", err);
                alert("Interface transmission fault. Core node database server connection link timing out.");
            } finally {
                // Restore interactive system controls if backend rejects registration
                actionButton.disabled = false;
                actionButton.textContent = "Register Operator Node";
                actionButton.classList.remove("opacity-50", "cursor-wait");
            }
        });
    </script>
</body>
</html>
